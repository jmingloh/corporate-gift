<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" role="img" aria-labelledby="title desc">
  <title id="title">JM Corporate Gift Sourcing horizontal logo</title>
  <desc id="desc">Horizontal logo with JM monogram icon and full company name.</desc>
  <defs>
    <linearGradient id="tile" x1="20" y1="18" x2="156" y2="162" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D1726"/>
      <stop offset="0.52" stop-color="#11392F"/>
      <stop offset="1" stop-color="#0E5B45"/>
    </linearGradient>
    <linearGradient id="gold" x1="49" y1="39" x2="132" y2="144" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4D98F"/>
      <stop offset="0.48" stop-color="#D3A451"/>
      <stop offset="1" stop-color="#B57C2C"/>
    </linearGradient>
    <filter id="softShadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#06151D" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g>
    <rect x="22" y="22" width="136" height="136" rx="27" fill="url(#tile)"/>
    <path d="M47 128c20-9 41-10 62-1 19 8 35 6 45-5v21H47v-15Z" fill="#FFFFFF" opacity="0.07"/>
    <g filter="url(#softShadow)">
      <path d="M53 72h74c6 0 11 5 11 11v50c0 6-5 11-11 11H53c-6 0-11-5-11-11V83c0-6 5-11 11-11Z" fill="#FFFFFF"/>
      <path d="M42 97h96" fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round"/>
      <path d="M90 72v72" fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round"/>
      <path d="M90 72c-10-17-27-24-37-15-6 5-4 13 3 17 8 5 21 1 34-2Z" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M90 72c10-17 27-24 37-15 6 5 4 13-3 17-8 5-21 1-34-2Z" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="90" y="125" text-anchor="middle" fill="#0D1726" font-family="Inter, Arial, Helvetica, sans-serif" font-size="43" font-weight="850" letter-spacing="0">JM</text>
    <text x="121" y="48" fill="#F1D486" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="850" letter-spacing="0">TM</text>
