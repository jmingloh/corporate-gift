    <text x="188" y="76" fill="#0D1726" font-size="39" font-weight="850">JM Corporate Gift</text>
    <text x="188" y="117" fill="#0D1726" font-size="39" font-weight="850">Sourcing</text>
    <text x="190" y="144" fill="#667085" font-size="17" font-weight="750">Corporate Gift Supplier</text>
    <path d="M188 153h218" fill="none" stroke="#D3A451" stroke-width="4" stroke-linecap="round"/>
  </g>
