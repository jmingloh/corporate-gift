<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" role="img" aria-labelledby="title desc">
  <title id="title">JM Corporate Gift Sourcing full logo</title>
  <desc id="desc">Full stacked logo with JM gift monogram, company name, and supplier subtext.</desc>
  <defs>
    <linearGradient id="tile" x1="108" y1="54" x2="413" y2="361" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D1726"/>
      <stop offset="0.52" stop-color="#11392F"/>
      <stop offset="1" stop-color="#0E5B45"/>
    </linearGradient>
    <linearGradient id="gold" x1="173" y1="117" x2="347" y2="335" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4D98F"/>
      <stop offset="0.48" stop-color="#D3A451"/>
      <stop offset="1" stop-color="#B57C2C"/>
    </linearGradient>
    <filter id="softShadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#06151D" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="110" y="42" width="300" height="300" rx="58" fill="url(#tile)"/>
  <path d="M161 273c45-21 90-23 137-4 43 18 75 13 97-12v47H161v-31Z" fill="#FFFFFF" opacity="0.07"/>
  <path d="M132 114c49-29 98-24 147 13 42 32 83 34 122 6" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" opacity="0.07"/>

  <g filter="url(#softShadow)">
    <path d="M179 147h162c12 0 21 9 21 21v108c0 12-9 21-21 21H179c-12 0-21-9-21-21V168c0-12 9-21 21-21Z" fill="#FFFFFF"/>
    <path d="M158 193h204" fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="round"/>
    <path d="M260 147v150" fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="round"/>
    <path d="M260 147c-20-36-55-51-77-31-12 10-9 26 5 34 17 10 44 4 72-3Z" fill="none" stroke="url(#gold)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M260 147c20-36 55-51 77-31 12 10 9 26-5 34-17 10-44 4-72-3Z" fill="none" stroke="url(#gold)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="260" y="256" text-anchor="middle" fill="#0D1726" font-family="Inter, Arial, Helvetica, sans-serif" font-size="94" font-weight="850" letter-spacing="0">JM</text>
  <text x="334" y="106" fill="#F1D486" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="850" letter-spacing="0">TM</text>

  <g font-family="Inter, Arial, Helvetica, sans-serif" text-anchor="middle" letter-spacing="0">
    <text x="260" y="418" fill="#0D1726" font-size="42" font-weight="850">JM Corporate Gift</text>
    <text x="260" y="464" fill="#0D1726" font-size="42" font-weight="850">Sourcing</text>
    <text x="260" y="501" fill="#667085" font-size="20" font-weight="750">Corporate Gift Supplier</text>
    <path d="M172 522h176" fill="none" stroke="#D3A451" stroke-width="5" stroke-linecap="round"/>
